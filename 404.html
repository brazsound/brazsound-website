<title>Page not found — BRAZ SOUND</title>
<style>html,body{margin:0;background:#143a3d}
.bs-not-found{box-sizing:border-box;min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;gap:40px;padding:48px max(24px,5.5vw) 28px;background:var(--brand-deep,#143a3d);color:var(--brand-white,#fff);font-family:var(--font-portfolio,Inter),-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;text-align:center}
.bs-not-found *{box-sizing:border-box}
.bs-not-found a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bs-not-found a:focus-visible{outline:2px solid var(--brand-lime,#91ed33);outline-offset:6px}
.bs-not-found .bs-nf-brand{display:inline-block;font-size:25px;font-weight:900;letter-spacing:-1.25px;line-height:1.1}
.bs-not-found .bs-nf-brand img{display:block;width:232px;max-width:100%;height:auto}
.bs-not-found .bs-nf-content{align-self:center;justify-self:center;width:100%;max-width:680px;padding:16px 0 32px}
.bs-not-found .bs-nf-number{margin:0 0 24px;color:var(--brand-lime,#91ed33);font-size:clamp(100px,15vw,180px);font-weight:900;letter-spacing:-.035em;line-height:.9;font-variant-numeric:tabular-nums}
.bs-not-found h1{margin:0;color:inherit;font-size:clamp(32px,5vw,58px);font-weight:900;letter-spacing:-.035em;line-height:1.06;text-transform:uppercase;text-wrap:balance}
.bs-not-found .bs-nf-description{max-width:420px;margin:24px auto 32px;color:var(--brand-muted,#bed0d1);font-size:16px;line-height:1.65;text-wrap:pretty}
.bs-not-found .bs-nf-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.bs-not-found .bs-nf-button{display:inline-flex;align-items:center;justify-content:center;gap:18px;min-height:50px;padding:14px 22px;border:1px solid var(--brand-line,#ffffff24);border-radius:12px;font-size:14px;line-height:1.4;font-weight:650;transition:background-color .18s,border-color .18s,color .18s}
.bs-not-found .bs-nf-primary{background:var(--brand-lime,#91ed33);border-color:transparent;color:var(--brand-deep,#143a3d)}
.bs-not-found .bs-nf-primary:hover{background:var(--brand-lime-hover,#a3f44e)}
.bs-not-found .bs-nf-secondary:hover{background:#ffffff08;border-color:#ffffff66}
.bs-not-found .bs-nf-button svg{width:17px;height:17px;flex:none}
.bs-not-found footer{color:var(--brand-muted,#bed0d1);font-size:10px;letter-spacing:.14em;line-height:1.6;text-transform:uppercase}
@media(max-width:480px){.bs-not-found{padding:32px 24px 24px;gap:32px}.bs-not-found .bs-nf-content{padding:8px 0 24px}.bs-not-found .bs-nf-description{font-size:15px}.bs-not-found .bs-nf-actions{flex-direction:column;max-width:300px;margin:auto}.bs-not-found .bs-nf-button{width:100%}}
@media(prefers-reduced-motion:reduce){.bs-not-found .bs-nf-button{transition:none}}
</style>
</head><body>
<main class="bs-not-found">

      <a class="bs-nf-button bs-nf-secondary" href="https://client.brazsound.com" rel="nofollow noreferrer">Client Portal <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></a>
    </nav>
  </section>
  <footer>BRAZ SOUND &middot; Matheus Braz</footer>
